<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="230" viewBox="0 0 1200 230"
     role="img" aria-labelledby="mech-title mech-desc">
  <title id="mech-title">Model, distill, reuse</title>
  <desc id="mech-desc">Three-stage diagram: raw phenomena are recognized as a model, a model is distilled into a skill, and a skill is reused across contexts.</desc>

  <rect width="1200" height="230" fill="#FAF8F4"/>

  <!-- connectors -->
  <g stroke="#C9BEAC" stroke-width="2">
    <line x1="392" y1="90" x2="440" y2="90"/>
    <path d="M 432 82 L 440 90 L 432 98" fill="none"/>
    <line x1="792" y1="90" x2="840" y2="90"/>
    <path d="M 832 82 L 840 90 L 832 98" fill="none"/>
  </g>

  <!-- Stage 1: Model -->
  <g id="stage-model">
    <rect x="64" y="34" width="26" height="26" fill="none" stroke="#7C6853" stroke-width="1.5"/>
    <text x="77" y="52" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#7C6853" text-anchor="middle">01</text>

    <g stroke="#7C6853" stroke-width="2" fill="none" stroke-dasharray="3 4">
      <circle cx="150" cy="90" r="38"/>
    </g>
    <g fill="#7C6853">
      <circle cx="134" cy="80" r="6"/>
      <rect x="156" y="74" width="11" height="11" transform="rotate(20 161 79)"/>
      <path d="M 140 100 L 150 84 L 160 100 Z"/>
    </g>

    <text x="64" y="150" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="23" font-weight="700" fill="#2A2622">MODEL</text>
    <text x="64" y="176" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" fill="#4A3F35">建模</text>
    <text x="64" y="202" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" fill="#8A8177">every pattern, named</text>
  </g>

  <!-- Stage 2: Distill -->
  <g id="stage-distill" transform="translate(400 0)">
    <rect x="64" y="34" width="26" height="26" fill="none" stroke="#7C6853" stroke-width="1.5"/>
    <text x="77" y="52" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#7C6853" text-anchor="middle">02</text>

    <g stroke="#7C6853" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 116 58 L 150 100 L 184 100 L 218 58 Z"/>
      <line x1="150" y1="100" x2="150" y2="118"/>
    </g>
    <circle cx="150" cy="130" r="6" fill="#7C6853"/>

    <text x="64" y="150" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="23" font-weight="700" fill="#2A2622">DISTILL</text>
    <text x="64" y="176" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" fill="#4A3F35">蒸馏</text>
    <text x="64" y="202" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" fill="#8A8177">reduced to essence</text>
  </g>

  <!-- Stage 3: Reuse -->
  <g id="stage-reuse" transform="translate(800 0)">
    <rect x="64" y="34" width="26" height="26" fill="none" stroke="#7C6853" stroke-width="1.5"/>
    <text x="77" y="52" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#7C6853" text-anchor="middle">03</text>

    <g stroke="#7C6853" stroke-width="2" fill="none" stroke-linejoin="round">
      <path d="M 150 62 L 174 76 L 174 104 L 150 118 L 126 104 L 126 76 Z" fill="#EFE7DA"/>
    </g>
    <g stroke="#B7A88F" stroke-width="1.5">
      <line x1="150" y1="90" x2="196" y2="70"/>
      <line x1="150" y1="90" x2="196" y2="90"/>
      <line x1="150" y1="90" x2="196" y2="110"/>
    </g>
    <g fill="#7C6853">
      <circle cx="199" cy="70" r="3.5"/>
      <circle cx="199" cy="90" r="3.5"/>
      <circle cx="199" cy="110" r="3.5"/>
    </g>

    <text x="64" y="150" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="23" font-weight="700" fill="#2A2622">REUSE</text>
    <text x="64" y="176" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" fill="#4A3F35">复用</text>
    <text x="64" y="202" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" fill="#8A8177">called by any agent</text>
  </g>
</svg>
