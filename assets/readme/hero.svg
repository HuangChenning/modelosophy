<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">modelosophy — 万物皆模型</title>
  <desc id="hero-desc">Editorial hero for modelosophy: the project name beside a funnel-and-drop distillation mark, evoking many raw ideas reduced to one reusable skill.</desc>

  <rect width="1200" height="320" fill="#FAF8F4"/>

  <rect x="64" y="56" width="120" height="4" fill="#7C6853"/>

  <text x="64" y="96" font-family="-apple-system, 'PingFang SC', 'Segoe UI', sans-serif"
        font-size="16" font-weight="600" letter-spacing="2.4" fill="#8A8177">AI SKILLS · 思维模型工坊</text>

  <text x="62" y="196" font-family="Georgia, 'Songti SC', serif"
        font-size="94" font-weight="700" letter-spacing="-1" fill="#2A2622">modelosophy</text>

  <text x="64" y="240" font-family="-apple-system, 'PingFang SC', 'Segoe UI', sans-serif"
        font-size="28" font-weight="400" fill="#4A3F35">万物皆模型 · All Things Are Models</text>

  <text x="64" y="284" font-family="-apple-system, 'PingFang SC', 'Segoe UI', sans-serif"
        font-size="16" font-weight="600" letter-spacing="1.6" fill="#8A8177">SKILL LIBRARY IN PROGRESS · 建设中</text>

  <g id="distillation-mark" stroke="#7C6853" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="878" cy="70" r="7" fill="#EFE7DA" stroke="#7C6853"/>
    <circle cx="928" cy="56" r="5" fill="#EFE7DA" stroke="#7C6853"/>
    <circle cx="978" cy="74" r="6" fill="#EFE7DA" stroke="#7C6853"/>
