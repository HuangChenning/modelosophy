    <path d="M 860 108 L 950 210 L 1050 210 L 1140 108 Z"/>
    <line x1="950" y1="210" x2="950" y2="252"/>
  </g>
  <circle cx="950" cy="270" r="9" fill="#7C6853"/>
</svg>
